<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%">
  <defs>
    <!-- Rich Haute Couture Gold Gradients -->
    <linearGradient id="richGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA6" />
      <stop offset="25%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#C69E32" />
      <stop offset="75%" stop-color="#F3DC7D" />
      <stop offset="100%" stop-color="#9A7416" />
    </linearGradient>

    <linearGradient id="softGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF2BF" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>

    <!-- Deep Emerald #002814 Facet Gradients -->
    <linearGradient id="emeraldFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003D1F" />
      <stop offset="50%" stop-color="#002814" />
      <stop offset="100%" stop-color="#00170A" />
    </linearGradient>

    <linearGradient id="emeraldFacet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#004D27" />
      <stop offset="60%" stop-color="#002B16" />
      <stop offset="100%" stop-color="#001A0D" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#005A2E" />
      <stop offset="100%" stop-color="#002814" />
    </linearGradient>

    <!-- Gown Velvet Black Gradient -->
    <linearGradient id="velvetBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="40%" stop-color="#0D0D0D" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Filters for Luxury Glow & Drop Shadows -->
    <filter id="goldDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="subtleBevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#FFEAA0" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- 1. EMERALD GEM ARCHED FRAME & TILES        -->
  <!-- ========================================== -->
  <g transform="translate(0, 5)" filter="url(#goldDropShadow)">
    <!-- Outer Gold Ornamental Beveled Rim -->
    <path d="M 250,35 L 305,80 L 320,185 L 305,270 L 250,305 L 195,270 L 180,185 L 195,80 Z"
          fill="none" stroke="url(#richGold)" stroke-width="7" stroke-linejoin="round" />

    <!-- Inner Stepped Gold Accent Border -->
    <path d="M 250,42 L 300,83 L 314,185 L 300,265 L 250,298 L 200,265 L 186,185 L 200,83 Z"
          fill="none" stroke="url(#softGold)" stroke-width="1.8" />

    <!-- Faceted Emerald Crystal Gem Interior Window -->
    <path d="M 250,45 L 297,85 L 312,185 L 297,262 L 250,295 L 203,262 L 188,185 L 203,85 Z"
          fill="url(#emeraldFacet1)" />

    <!-- Beveled Gem Geometric Facet Tiles (Left & Right Mosaic Wings) -->
    <!-- Top-left facet -->
    <polygon points="250,45 203,85 250,115" fill="url(#emeraldFacet2)" stroke="url(#richGold)" stroke-width="1.2" opacity="0.85" />
    <!-- Top-right facet -->
    <polygon points="250,45 297,85 250,115" fill="url(#emeraldFacet1)" stroke="url(#richGold)" stroke-width="1.2" opacity="0.85" />
    
    <!-- Mid-left facet -->
    <polygon points="203,85 188,185 235,160 250,115" fill="url(#emeraldGlow)" stroke="url(#richGold)" stroke-width="1.2" opacity="0.75" />
    <!-- Mid-right facet -->
    <polygon points="297,85 312,185 265,160 250,115" fill="url(#emeraldFacet2)" stroke="url(#richGold)" stroke-width="1.2" opacity="0.75" />

    <!-- Lower-left facet -->
    <polygon points="188,185 203,262 240,225 235,160" fill="url(#emeraldFacet1)" stroke="url(#richGold)" stroke-width="1.2" opacity="0.7" />
    <!-- Lower-right facet -->
    <polygon points="312,185 297,262 260,225 265,160" fill="url(#emeraldGlow)" stroke="url(#richGold)" stroke-width="1.2" opacity="0.7" />

    <!-- Bottom diamond facet -->
    <polygon points="250,295 203,262 240,225 250,250" fill="url(#emeraldFacet2)" stroke="url(#richGold)" stroke-width="1.2" opacity="0.8" />
    <polygon points="250,295 297,262 260,225 250,250" fill="url(#emeraldFacet1)" stroke="url(#richGold)" stroke-width="1.2" opacity="0.8" />

    <!-- Delicate Micro Texture grid on emerald -->
    <path d="M 203,85 L 297,262 M 297,85 L 203,262" stroke="url(#richGold)" stroke-width="0.8" opacity="0.35" />
  </g>

  <!-- ========================================== -->
  <!-- 2. POISED MODEST WOMAN SILHOUETTE          -->
  <!-- In flowing black abaya with gold trim      -->
  <!-- ========================================== -->
  <g transform="translate(0, 5)" filter="url(#goldDropShadow)">
    <!-- Flowing Obsidian Abaya Dress Train (Sweeping outwards at base) -->
    <path d="M 252,108 
             C 246,120 238,145 233,180
             C 225,230 205,285 135,325
             C 175,328 220,312 250,305
             C 280,312 325,328 365,325
             C 295,285 275,230 267,180
             C 262,145 256,120 252,108 Z"
          fill="url(#velvetBlack)" />

    <!-- Left & Right Gold Filigree Gown Hem Borders -->
    <path d="M 135,325 C 185,322 225,302 246,285" fill="none" stroke="url(#richGold)" stroke-width="3" stroke-linecap="round" />
    <path d="M 365,325 C 315,322 275,302 254,285" fill="none" stroke="url(#richGold)" stroke-width="3" stroke-linecap="round" />

    <!-- Inner Cascading Folds with Gold Accents -->
    <path d="M 235,190 C 238,245 242,280 236,310" fill="none" stroke="url(#richGold)" stroke-width="1.5" opacity="0.9" />
    <path d="M 265,190 C 262,245 258,280 264,310" fill="none" stroke="url(#richGold)" stroke-width="1.5" opacity="0.9" />
    <path d="M 250,170 L 250,305" fill="none" stroke="#222222" stroke-width="2" />

    <!-- Veiled Hijab / Hood Silhouette -->
    <path d="M 250,70
             C 240,70 233,78 233,90
             C 233,105 240,118 244,130
             C 247,118 250,112 253,105
             C 255,98 255,92 254,85
             C 254,76 248,70 250,70 Z"
          fill="url(#velvetBlack)" />

    <!-- Delicate Gold Trim Along Veil & Face Contour -->
    <path d="M 244,72 C 248,78 253,85 253,95 C 253,105 249,112 245,120"
          fill="none" stroke="url(#richGold)" stroke-width="1.8" stroke-linecap="round" />

    <!-- Modest Sleeve with Gold Embroidered Cuff -->
    <path d="M 255,145 C 264,155 273,170 278,190 C 274,193 268,194 263,190 C 260,175 254,160 250,150 Z"
          fill="url(#velvetBlack)" />
    <!-- Gold Embroidered Sleeve Border -->
    <path d="M 263,190 C 268,193 274,193 278,190"
          fill="none" stroke="url(#richGold)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 264,186 C 268,189 273,189 277,186"
          fill="none" stroke="url(#softGold)" stroke-width="1" />
  </g>

  <!-- ========================================== -->
  <!-- 3. BRAND TYPOGRAPHY: EMERALD HAYA          -->
  <!-- Pure Gold Embossed High-Fashion Serif      -->
  <!-- ========================================== -->
  <g transform="translate(0, 15)">
    <!-- EMERALD Main Stately Title -->
    <text x="250" y="388"
          text-anchor="middle"
          font-family="'Cormorant Garamond', 'Cinzel', Georgia, serif"
          font-size="52"
          font-weight="600"
          letter-spacing="9"
          fill="url(#richGold)"
          filter="url(#subtleBevel)">
      EMERALD
    </text>

    <!-- Horizontal Filigree Dividers with Diamond Arrows -->
    <!-- Left Divider -->
    <path d="M 70,426 L 155,426" stroke="url(#richGold)" stroke-width="1.5" stroke-linecap="round" />
    <polygon points="155,426 150,423 150,429" fill="url(#richGold)" />
    <circle cx="70" cy="426" r="2" fill="url(#richGold)" />

    <!-- H A Y A Subtitle -->
    <text x="250" y="434"
          text-anchor="middle"
          font-family="'Cormorant Garamond', 'Cinzel', Georgia, serif"
          font-size="28"
          font-weight="500"
          letter-spacing="16"
          fill="url(#richGold)">
      HAYA
    </text>

    <!-- Right Divider -->
    <polygon points="345,426 350,423 350,429" fill="url(#richGold)" />
    <path d="M 345,426 L 430,426" stroke="url(#richGold)" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="430" cy="426" r="2" fill="url(#richGold)" />

    <!-- Bottom Jewelry Crest: Center Diamond with Twin Flourishes -->
    <g transform="translate(250, 470)">
      <!-- Left Leaf Flourish -->
      <path d="M -28,-1 C -20,-5 -14,-4 -7,-1 C -12,2 -18,2 -28,-1 Z" fill="url(#richGold)" />
      <circle cx="-32" cy="-1" r="1.5" fill="url(#richGold)" />

      <!-- Center Faceted Emerald Gemstone -->
      <polygon points="0,-12 12,0 0,12 -12,0" fill="#002814" stroke="url(#richGold)" stroke-width="2.5" />
      <polygon points="0,-6 6,0 0,6 -6,0" fill="#004D27" stroke="url(#softGold)" stroke-width="1" />
      <circle cx="0" cy="0" r="2" fill="#FCEBA6" />

      <!-- Right Leaf Flourish -->
      <path d="M 7,-1 C 14,-4 20,-5 28,-1 C 18,2 12,2 7,-1 Z" fill="url(#richGold)" />
      <circle cx="32" cy="-1" r="1.5" fill="url(#richGold)" />
    </g>
  </g>
</svg>
