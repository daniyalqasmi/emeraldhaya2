    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />

    <!-- Schema.org JSON-LD Structured Data for Organization, Store & BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://emeraldhaya.com/#organization",
          "name": "Emerald Haya",
          "url": "https://emeraldhaya.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://emeraldhaya.com/src/assets/logo.svg",
            "caption": "Emerald Haya Luxury Islamic Haute Couture"
          },
          "sameAs": [
            "https://instagram.com/emeraldhayaofficial"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+971-4-388-9200",
            "contactType": "concierge services",
            "areaServed": ["AE", "SA", "QA", "KW", "OM", "BH", "GB", "US", "PK"],
            "availableLanguage": ["English", "Arabic", "Urdu"]
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://emeraldhaya.com/#website",
          "url": "https://emeraldhaya.com",
          "name": "Emerald Haya Boutique",
          "publisher": { "@id": "https://emeraldhaya.com/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://emeraldhaya.com/#/shop?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "ClothingStore",
          "@id": "https://emeraldhaya.com/#store",
          "name": "Emerald Haya Atelier",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Unit 402, Fashion Avenue, Downtown Dubai",
            "addressLocality": "Dubai",
            "addressCountry": "AE"
          },
          "currenciesAccepted": "USD, AED, SAR, GBP, PKR",
          "paymentAccepted": "Cash on Delivery, Direct Concierge Checkout",
          "priceRange": "$$$$"
        }
      ]
    }
    </script>

  <body class="bg-[#FDFBF7] text-[#111111] antialiased selection:bg-[#006B5B] selection:text-[#FFFFFF]">
